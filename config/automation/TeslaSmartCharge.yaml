#####################################################################
#                       S M A R T      C H A R G E
#####################################################################
#
# Recharge intelligente de la Tesla Model Y "F.R.I.D.A.Y"
# Adapte l'amperage en temps reel au surplus solaire.
#
# Concepts :
#   input_boolean.tesla_smart_charge = MODE actif (intention)
#   switch.f_r_i_d_a_y_recharge        = charge en cours (etat reel)
#
# Contenu :
#   0. Refresh donnees       (arrivee a la maison via Tessie)
#  0b. Refresh donnees WiFi  (connexion WiFi via Netgear)
#  0c. Refresh sur saut conso (delta P1 > 3kW + voiture awake + API dit pas charge)
#  0d. Refresh sur chute conso (delta P1 < -3kW + voiture home/awake + API dit charge)
#  0e. Stop charge HP a l'arrivee (GPS ou WiFi, HP, pas de surplus) + active mode solaire
#  0f. Verification au demarrage HA (solar_charging stale + voiture absente → reset)
#   1. Activation du mode    (toggle ON + surplus solaire)
#  1b. Activation en attente (toggle ON sans soleil → notif)
#   2. Desactivation du mode (toggle OFF)
#   3. Demarrage auto        (cable, solaire, charge manuelle)
#  3b. Sync flag solar_charging (charge demarree hors auto 3)
#   4. Arret auto            (debranche, arret manuel, charge finie)
#   5. Suivi amperage        (toutes les 2 min)
#   6. Pause solaire         (surplus < 5A pendant 3 min)
#   7. Resume solaire        (surplus >= 5A pendant 3 min)
#   8. Protection reseau     (soutirage > tesla_grid_limit - 500W marge)
#   9. Reset limite + solar_charging (cable debranche, nuit tombee, ou depart maison)
#  10. Sync helper SoC max   (modification utilisateur depuis le dashboard)
#  11. Refresh apres amps    (poll Tessie 10s apres set ampérage)
#
# Helpers de session et limite de charge :
#   - input_boolean.tesla_solar_charging : session solaire active
#     Set ON par autos 1, 3 et 3b au demarrage, OFF par autos 2, 4, 9.
#     Utilise comme condition dans auto 7 (Resume) a la place des
#     device_trackers : garantit qu'on ne reprend que si une session
#     a ete explicitement lancee (voiture forcement home+branchee).
#   - input_number.tesla_soc_solaire_max : SoC max en mode solaire (defaut 80%)
#     Force au demarrage des autos 1 et 3, restaure a la fin (auto 9).
#   - input_number.tesla_soc_cible       : SoC cible en HC (defaut 50%)
#     Force au demarrage HC, restaure a tesla_soc_solaire_max a la fin HC.
#
#####################################################################

#####################################################################
# 0. REFRESH DONNEES (arrivee a la maison)
#####################################################################
# Quand la Tesla arrive a la maison, force un refresh des donnees
# Tessie pour avoir des valeurs fraiches (batterie, cable, etc.).
#####################################################################
- id: 'tesla_smart_charge_refresh'
  alias: Tesla Smart Charge - Refresh donnees

  trigger:
    - platform: state
      entity_id: device_tracker.f_r_i_d_a_y_emplacement
      to: home
  action:
    - delay:
        seconds: 30
    - service: script.tesla_refresh
  mode: single

#####################################################################
# 0b. REFRESH DONNEES (connexion WiFi via Netgear)
#####################################################################
# Quand la Tesla se connecte au WiFi maison (detection Netgear),
# force un refresh Tessie. Declenche un refresh au plus tot apres
# l'entree au garage. Delai 30s : laisse le temps a la voiture de
# stabiliser sa connexion WiFi avant d'envoyer le wake.
#####################################################################
- id: 'tesla_smart_charge_refresh_wifi'
  alias: Tesla Smart Charge - Refresh donnees (WiFi)

  trigger:
    - platform: state
      entity_id: device_tracker.tesla_y
      to: home
  action:
    - delay:
        seconds: 30
    - service: script.tesla_refresh
  mode: single

#####################################################################
# 0e. STOP CHARGE HP A L'ARRIVEE (GPS ou WiFi)
#####################################################################
# Si la voiture arrive a la maison (Tessie ou WiFi Netgear) alors
# qu'elle est deja en charge et qu'on est en heures pleines sans
# surplus solaire, coupe immediatement la charge et active le mode
# solaire pour que la charge reprenne automatiquement quand le
# surplus devient suffisant (via auto 3, trigger power_available).
#
# Contexte : la Tesla peut demarrer seule au branchement avant que
# HA sache que la voiture est a la maison (lag Tessie ~1-2 min).
# L'auto 6 (Pause solaire) prend normalement le relais mais necessite
# que le switch ait ete actif 3 min — cette auto reagit sans delai.
#
# Double trigger : GPS (Tessie) et WiFi (Netgear) pour reagir
# des que l'un ou l'autre detecte l'arrivee.
# Pas de condition sur device_tracker.f_r_i_d_a_y_emplacement : si le
# trigger WiFi fire en premier, le GPS peut encore etre a not_home.
#####################################################################
- id: 'tesla_smart_charge_stop_hp_arrival'
  alias: Tesla Smart Charge - Stop charge HP a l arrivee

  trigger:
    - platform: state
      entity_id: device_tracker.f_r_i_d_a_y_emplacement
      to: home
    - platform: state
      entity_id: device_tracker.tesla_y
      to: home
  condition:
    - condition: state
      entity_id: input_boolean.tesla_night_charge_pending
      state: 'off'
    - condition: state
      entity_id: sensor.p1_meter_3c39e7284d28_active_tariff
      state: '1'
    - condition: state
      entity_id: switch.f_r_i_d_a_y_recharge
      state: 'on'
    - condition: numeric_state
      entity_id: sensor.tesla_optimized_amp
      below: 5
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.f_r_i_d_a_y_recharge
    # Active le mode solaire : l'auto 3 (demarrage_auto, trigger power_available)
    # relancera automatiquement des que tesla_optimized_amp > 2 pendant 1 min.
    # turn_on est idempotent — si le mode etait deja actif, aucun effet de bord.
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.tesla_smart_charge
    - service: script.notify_fabien
      data:
        title: Tesla Smart Charge
        message: >-
          {% set bat = states('sensor.f_r_i_d_a_y_niveau_de_la_batterie') | int(0) %}
          Charge arretee a l'arrivee (heures pleines, pas de surplus). Batterie : {{ bat }}%.
          Mode solaire active — reprendra automatiquement des que le surplus est suffisant.
  mode: single

#####################################################################
# 0f. VERIFICATION AU DEMARRAGE HA (restart)
#####################################################################
# Au demarrage de HA, verifie la coherence de solar_charging.
#
# Cas couvert : HA redemarré alors que solar_charging etait deja stale
# (voiture partie avant le restart, device_tracker deja not_home).
# Dans ce cas l'auto 9 trigger "depart" ne peut plus fire (aucune
# transition not_home → il faut relancer l'etat).
# Sans ce check, solar_charging reste ON → l'auto 7 (Resume) peut
# envoyer des commandes a la voiture absente des que le solaire monte.
#
# Delai 60s : attend l'initialisation des integrations Tessie et
# Netgear avant de lire les device_trackers (peuvent etre "unknown"
# les premieres secondes apres demarrage).
# Le if interne re-verifie la position apres le delai : si la voiture
# rentre pendant ce temps, on ne touche pas a solar_charging.
#####################################################################
- id: 'tesla_smart_charge_startup_check'
  alias: Tesla Smart Charge - Verification au demarrage

  trigger:
    - platform: homeassistant
      event: start

  condition:
    - condition: state
      entity_id: input_boolean.tesla_solar_charging
      state: 'on'
    - condition: state
      entity_id: input_boolean.tesla_night_charge_pending
      state: 'off'

  action:
    - delay:
        seconds: 60
    - if:
        - condition: state
          entity_id: input_boolean.tesla_solar_charging
          state: 'on'
        - condition: template
          value_template: >-
            {{ not is_state('device_tracker.f_r_i_d_a_y_emplacement', 'home')
               and not is_state('device_tracker.tesla_y', 'home') }}
      then:
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.tesla_solar_charging
        - service: script.notify_fabien
          data:
            title: Tesla Smart Charge
            message: >-
              {% set bat = states('sensor.f_r_i_d_a_y_niveau_de_la_batterie') | int(0) %}
              Demarrage HA : session solaire nettoyee (voiture absente, solar_charging remis a OFF).
              Batterie : {{ bat }}%.
  mode: single

#####################################################################
# 0c. REFRESH SUR SAUT DE CONSO (desync charge)
#####################################################################
# Detecte un demarrage de charge non encore reporte par la Tessie :
# si la conso maison saute (delta > 3 kW sur 2 min) ALORS QUE
#   - la voiture est awake (status on)
#   - l'API dit qu'on ne charge pas (charging != charging/starting)
# alors c'est probablement un desync. On force un poll Tessie
# (sans wake puisque la voiture est deja online).
#
# Pas de condition sur charge_cable : ce sensor vient aussi de la
# Tessie et peut etre stale — c'est justement ce qu'on cherche
# a rafraichir.
# Le sensor sensor.p1_power_delta_2min est defini dans configuration.yaml.
#####################################################################
- id: 'tesla_smart_charge_refresh_load_jump'
  alias: Tesla Smart Charge - Refresh sur saut conso

  trigger:
    - platform: numeric_state
      entity_id: sensor.p1_power_delta_2min
      above: 3000
  condition:
    - condition: state
      entity_id: binary_sensor.f_r_i_d_a_y_etat
      state: 'on'
    - condition: template
      value_template: >-
        {{ states('sensor.f_r_i_d_a_y_charge') not in ['charging', 'starting'] }}
  action:
    - service: script.tesla_update_no_wake
  mode: single

#####################################################################
# 0d. REFRESH SUR CHUTE DE CONSO (desync charge arretee)
#####################################################################
# Symetrique de 0c : detecte un arret de charge non encore reporte par
# la Tessie. Si la conso maison chute (delta < -3 kW sur 2 min)
# ALORS QUE
#   - la voiture est awake (status on)
#   - la voiture est a la maison (location home)
#   - l'API dit qu'on charge (charging in [charging, starting])
# alors c'est probablement un desync. On force un poll Tessie.
#
# Difference avec 0c : ici on ajoute la condition "location home"
# car une chute de conso peut venir d'autre chose (gros appareil
# qui s'arrete) — la condition "API dit charge" + "location home"
# limite les faux positifs.
#####################################################################
- id: 'tesla_smart_charge_refresh_load_drop'
  alias: Tesla Smart Charge - Refresh sur chute conso

  trigger:
    - platform: numeric_state
      entity_id: sensor.p1_power_delta_2min
      below: -3000
  condition:
    - condition: state
      entity_id: binary_sensor.f_r_i_d_a_y_etat
      state: 'on'
    - condition: or
      conditions:
        - condition: state
          entity_id: device_tracker.f_r_i_d_a_y_emplacement
          state: home
        - condition: state
          entity_id: device_tracker.tesla_y
          state: home
    - condition: template
      value_template: >-
        {{ states('sensor.f_r_i_d_a_y_charge') in ['charging', 'starting'] }}
  action:
    - service: script.tesla_update_no_wake
  mode: single

#####################################################################
# 1. ACTIVATION DU MODE
#####################################################################
# Toggle ON : demarre la charge seulement si les conditions sont
# reunies (dont surplus solaire >= 5A). Sinon le mode est actif
# et les triggers auto (3) prendront le relais quand le soleil arrive.
#####################################################################
- id: 'tesla_smart_charge_activation'
  alias: Tesla Smart Charge - Activation

  trigger:
    - platform: state
      entity_id: input_boolean.tesla_smart_charge
      to: 'on'
  condition:
    - condition: state
      entity_id: input_boolean.tesla_night_charge_pending
      state: 'off'
    - condition: or
      conditions:
        - condition: state
          entity_id: device_tracker.f_r_i_d_a_y_emplacement
          state: home
        - condition: state
          entity_id: device_tracker.tesla_y
          state: home
    - condition: state
      entity_id: binary_sensor.f_r_i_d_a_y_cable_de_charge
      state: 'on'
    - condition: state
      entity_id: switch.f_r_i_d_a_y_recharge
      state: 'off'
    - condition: template
      value_template: >-
        {{ states('sensor.f_r_i_d_a_y_niveau_de_la_batterie') | int
           < (states('number.f_r_i_d_a_y_limite_de_recharge') | int - 1) }}
    - condition: numeric_state
      entity_id: sensor.tesla_optimized_amp
      above: 4
  action:
    - service: script.tesla_refresh
    - delay:
        seconds: 5
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.awtrix_toggle_tesla
    - delay:
        seconds: 3
    # Force la limite Tesla a la valeur du helper SoC max solaire
    # avant chaque demarrage : garantit que la limite suit toujours
    # la preference utilisateur, meme apres une charge HC qui a pu
    # la modifier (filet en cas de defaut des autos NightCharge 2/4/5).
    - service: number.set_value
      target:
        entity_id: number.f_r_i_d_a_y_limite_de_recharge
      data:
        value: "{{ states('input_number.tesla_soc_solaire_max') | int(80) }}"
    # solar_charging pose AVANT switch.turn_on : empeche auto 3b de re-fire
    # dans ce cas normal (3b ne fire que si solar_charging est encore OFF).
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.tesla_solar_charging
    - service: switch.turn_on
      target:
        entity_id: switch.f_r_i_d_a_y_recharge
    - service: number.set_value
      target:
        entity_id: number.f_r_i_d_a_y_courant_de_recharge
      data:
        value: '5'
    - service: script.notify_fabien
      data:
        title: Tesla Smart Charge
        message: >-
          {% set bat = states('sensor.f_r_i_d_a_y_niveau_de_la_batterie') | int(0) %}
          {% set limit = states('number.f_r_i_d_a_y_limite_de_recharge') | int(0) %}
          {% set solaire = states('sensor.solar_total') | int(0) %}
          Smart Charge active. Batterie : {{ bat }}% (limite {{ limit }}%).
          Production solaire : {{ solaire }}W.
  mode: single

#####################################################################
# 1b. ACTIVATION SANS SOLEIL (notification)
#####################################################################
# Toggle ON mais surplus insuffisant : notifie que le mode est actif
# et que la charge demarrera automatiquement quand le soleil arrive.
#####################################################################
- id: 'tesla_smart_charge_activation_waiting'
  alias: Tesla Smart Charge - Activation en attente

  trigger:
    - platform: state
      entity_id: input_boolean.tesla_smart_charge
      to: 'on'
  condition:
    - condition: state
      entity_id: input_boolean.tesla_night_charge_pending
      state: 'off'
    - condition: or
      conditions:
        - condition: state
          entity_id: device_tracker.f_r_i_d_a_y_emplacement
          state: home
        - condition: state
          entity_id: device_tracker.tesla_y
          state: home
    - condition: state
      entity_id: binary_sensor.f_r_i_d_a_y_cable_de_charge
      state: 'on'
    - condition: state
      entity_id: switch.f_r_i_d_a_y_recharge
      state: 'off'
    - condition: template
      value_template: >-
        {{ states('sensor.f_r_i_d_a_y_niveau_de_la_batterie') | int
           < (states('number.f_r_i_d_a_y_limite_de_recharge') | int - 1) }}
    - condition: numeric_state
      entity_id: sensor.tesla_optimized_amp
      below: 5
  action:
    - service: script.notify_fabien
      data:
        title: Tesla Smart Charge
        message: >-
          {% set bat = states('sensor.f_r_i_d_a_y_niveau_de_la_batterie') | int(0) %}
          {% set solaire = states('sensor.solar_total') | int(0) %}
          Smart Charge actif mais surplus solaire insuffisant ({{ solaire }}W).
          Batterie : {{ bat }}%. La charge demarrera automatiquement
          quand le soleil sera suffisant.
  mode: single

#####################################################################
# 2. DESACTIVATION DU MODE
#####################################################################
# Toggle OFF : arrete la charge si elle tourne, bascule Awtrix.
# Ignore si une charge nocturne est en cours (pending=on) pour
# ne pas interrompre celle-ci quand l'user desactive SmartCharge.
#####################################################################
- id: 'tesla_smart_charge_deactivation'
  alias: Tesla Smart Charge - Desactivation

  trigger:
    - platform: state
      entity_id: input_boolean.tesla_smart_charge
      to: 'off'
  condition:
    - condition: state
      entity_id: input_boolean.tesla_night_charge_pending
      state: 'off'
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.tesla_solar_charging
    - choose:
        - conditions:
            - condition: state
              entity_id: switch.f_r_i_d_a_y_recharge
              state: 'on'
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.f_r_i_d_a_y_recharge
            - delay:
                seconds: 3
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.awtrix_toggle_tesla
            - service: script.notify_fabien
              data:
                title: Tesla Smart Charge
                message: >-
                  {% set bat = states('sensor.f_r_i_d_a_y_niveau_de_la_batterie') | int(0) %}
                  {% set energy = states('sensor.f_r_i_d_a_y_energie_ajoutee_derniere_recharge') | float(0) | round(1) %}
                  Smart Charge desactive. Batterie : {{ bat }}%.
                  {% if energy > 0 %}Energie ajoutee : {{ energy }} kWh.{% endif %}
  mode: single

#####################################################################
# 3. DEMARRAGE AUTO
#####################################################################
# Demarre la charge quand un evenement pertinent survient :
#   - Charge lancee manuellement (voiture ou app)
#   - Cable branche
#   - Surplus solaire disponible
#####################################################################
- id: 'tesla_smart_charge_start'
  alias: Tesla Smart Charge - Demarrage auto

  trigger:
    - platform: numeric_state
      entity_id: sensor.f_r_i_d_a_y_vitesse_de_recharge
      above: 0
      id: manual_start
    - platform: state
      entity_id: binary_sensor.f_r_i_d_a_y_cable_de_charge
      from: 'off'
      to: 'on'
      for:
        seconds: 30
      id: charger_plugin
    # Seuil aligne sur le plancher reel de charge (5A, force au demarrage
    # ligne courant_de_recharge ci-dessous) et sur le seuil de Pause (auto 6,
    # <5A). Avant le fix du 2026-07-25, le seuil etait a 2A : un demarrage
    # pouvait etre déclenché avec un surplus insuffisant pour tenir le
    # minimum de 5A, menant a une pause quasi immediate (cycle demarre/pause
    # inutile a l'aube quand le solaire est encore faible et instable).
    - platform: numeric_state
      entity_id: sensor.tesla_optimized_amp
      above: 4
      for:
        minutes: 1
      id: power_available
  condition:
    - condition: state
      entity_id: input_boolean.tesla_smart_charge
      state: 'on'
    - condition: state
      entity_id: input_boolean.tesla_night_charge_pending
      state: 'off'
    - condition: or
      conditions:
        - condition: state
          entity_id: device_tracker.f_r_i_d_a_y_emplacement
          state: home
        - condition: state
          entity_id: device_tracker.tesla_y
          state: home
    # Garde cable obligatoire : empeche le trigger power_available (base sur
    # le P1 meter, independant de la voiture) de demarrer la charge quand la
    # voiture est absente avec un device_tracker GPS encore stale sur "home".
    # Empeche aussi manual_start de reagir si la voiture charge ailleurs
    # (Supercharger) pendant que Tessie n'a pas encore mis a jour le GPS.
    - condition: state
      entity_id: binary_sensor.f_r_i_d_a_y_cable_de_charge
      state: 'on'
    - condition: state
      entity_id: switch.f_r_i_d_a_y_recharge
      state: 'off'
    - condition: template
      value_template: >-
        {{ states('sensor.f_r_i_d_a_y_niveau_de_la_batterie') | int
           < (states('number.f_r_i_d_a_y_limite_de_recharge') | int - 1) }}
    # Evite un double demarrage avec Resume apres une pause solaire :
    # si la pause a coupe la charge il y a moins de 5 min, on laisse
    # le Resume gerer la reprise (seuil + hysteresis plus robustes).
    - condition: template
      value_template: >-
        {% set last_pause = state_attr('automation.tesla_smart_charge_pause_surplus_insuffisant', 'last_triggered') %}
        {{ last_pause is none or (now() - last_pause).total_seconds() > 300 }}
  action:
    - service: script.tesla_refresh
    - delay:
        seconds: 5
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.awtrix_toggle_tesla
    - delay:
        seconds: 3
    # Force la limite Tesla a la valeur du helper SoC max solaire
    # avant chaque demarrage : garantit que la limite suit toujours
    # la preference utilisateur, meme apres une charge HC qui a pu
    # la modifier (filet en cas de defaut des autos NightCharge 2/4/5).
    - service: number.set_value
      target:
        entity_id: number.f_r_i_d_a_y_limite_de_recharge
      data:
        value: "{{ states('input_number.tesla_soc_solaire_max') | int(80) }}"
    # solar_charging pose AVANT switch.turn_on : empeche auto 3b de re-fire
    # dans ce cas normal (3b ne fire que si solar_charging est encore OFF).
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.tesla_solar_charging
    - service: switch.turn_on
      target:
        entity_id: switch.f_r_i_d_a_y_recharge
    - service: number.set_value
      target:
        entity_id: number.f_r_i_d_a_y_courant_de_recharge
      data:
        value: '5'
    - service: script.notify_fabien
      data:
        title: Tesla Smart Charge
        message: >-
          {% set reasons = {
            'manual_start': 'charge manuelle detectee',
            'charger_plugin': 'cable branche',
            'power_available': 'surplus solaire disponible'
          } %}
          {% set bat = states('sensor.f_r_i_d_a_y_niveau_de_la_batterie') | int(0) %}
          {% set limit = states('number.f_r_i_d_a_y_limite_de_recharge') | int(0) %}
          {% set solaire = states('sensor.solar_total') | int(0) %}
          Smart Charge demarre ({{ reasons.get(trigger.id, trigger.id) }}).
          Batterie : {{ bat }}% (limite {{ limit }}%).
          Production solaire : {{ solaire }}W.
  mode: single

#####################################################################
# 3b. SYNC FLAG SOLAR_CHARGING (charge demarree hors auto 3)
#####################################################################
# Complement de l'auto 3 : positionne tesla_solar_charging a ON
# des que switch.f_r_i_d_a_y_recharge passe de off a on, si le maitre
# est actif mais que la session solaire n'etait pas encore marquee.
#
# Cas couvert : la Tesla demarre la charge automatiquement (auto-charge
# native, commande app) avant que l'auto 3 ait eu le temps de s'executer
# — Tessie remonte switch ON en < 30s (delai du trigger charger_plugin),
# ou aucun des trois triggers de l'auto 3 n'a detecte de nouvelle transition.
#
# Sans cette auto, solar_charging resterait OFF : l'auto 7 (Resume) ne
# pourrait pas reprendre la charge apres une pause solaire.
#
# Idempotent : si auto 3 avait deja pose le flag avant la transition du
# switch, turn_on n'a aucun effet de bord.
#####################################################################
- id: 'tesla_smart_charge_sync_solar_flag'
  alias: Tesla Smart Charge - Sync flag solar charging

  trigger:
    - platform: state
      entity_id: switch.f_r_i_d_a_y_recharge
      from: 'off'
      to: 'on'
  condition:
    - condition: state
      entity_id: input_boolean.tesla_smart_charge
      state: 'on'
    - condition: state
      entity_id: input_boolean.tesla_night_charge_pending
      state: 'off'
    - condition: state
      entity_id: input_boolean.tesla_solar_charging
      state: 'off'
    - condition: or
      conditions:
        - condition: state
          entity_id: device_tracker.f_r_i_d_a_y_emplacement
          state: home
        - condition: state
          entity_id: device_tracker.tesla_y
          state: home
    # Garde cable : si la Tesla demarre une charge ailleurs (Supercharger) et
    # que le GPS est encore stale sur "home", on ne pose pas solar_charging=ON.
    # Sans cette garde, solar_charging resterait ON et l'auto 7 (Resume)
    # enverrait des commandes a la voiture absente.
    - condition: state
      entity_id: binary_sensor.f_r_i_d_a_y_cable_de_charge
      state: 'on'
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.tesla_solar_charging
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.awtrix_toggle_tesla
    - service: script.notify_fabien
      data:
        title: Tesla Smart Charge
        message: >-
          {% set bat = states('sensor.f_r_i_d_a_y_niveau_de_la_batterie') | int(0) %}
          {% set limit = states('number.f_r_i_d_a_y_limite_de_recharge') | int(0) %}
          Smart Charge detecte (charge demarree par la voiture).
          Batterie : {{ bat }}% (limite {{ limit }}%).
  mode: single

#####################################################################
# 4. ARRET AUTO
#####################################################################
# Arrete la charge quand :
#   - Cable debranche
#   - Charge arretee manuellement
#   - Amperage tombe a 0 (charge terminee)
#####################################################################
- id: 'tesla_smart_charge_stop'
  alias: Tesla Smart Charge - Arret auto

  trigger:
    - platform: state
      entity_id: cover.f_r_i_d_a_y_port_de_charge
      to: closed
      for:
        minutes: 1
      id: charger_plugout
    # Etat brut Tessie (fix 2026-07-25) : anciennement base sur
    # sensor.f_r_i_d_a_y_vitesse_de_recharge < 1, une valeur derivee/calculee
    # qui s'est averee peu fiable juste apres un (re)demarrage a faible
    # ampérage (vue a -28 alors que la voiture chargeait reellement a 6A).
    # sensor.f_r_i_d_a_y_charge est l'etat brut rapporte par l'API, sans
    # calcul ni delai de stabilisation — declenchait le cycle demarre/
    # suspend/redemarre observe a l'aube.
    - platform: state
      entity_id: sensor.f_r_i_d_a_y_charge
      to: 'stopped'
      for:
        minutes: 1
      id: manual_stop
    - platform: numeric_state
      entity_id: sensor.f_r_i_d_a_y_courant_du_chargeur
      below: 1
      for:
        minutes: 1
      id: amps_too_low
  condition:
    - condition: state
      entity_id: input_boolean.tesla_smart_charge
      state: 'on'
    - condition: state
      entity_id: input_boolean.tesla_night_charge_pending
      state: 'off'
    - condition: state
      entity_id: switch.f_r_i_d_a_y_recharge
      state: 'on'
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.f_r_i_d_a_y_recharge
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.tesla_solar_charging
    - delay:
        seconds: 3
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.awtrix_toggle_tesla
    - service: script.notify_fabien
      data:
        title: Tesla Smart Charge
        message: >-
          {% set reasons = {
            'charger_plugout': 'cable debranche',
            'manual_stop': 'arret manuel',
            'amps_too_low': 'charge terminee'
          } %}
          {% set bat = states('sensor.f_r_i_d_a_y_niveau_de_la_batterie') | int(0) %}
          {% set energy = states('sensor.f_r_i_d_a_y_energie_ajoutee_derniere_recharge') | float(0) | round(1) %}
          Smart Charge arrete ({{ reasons.get(trigger.id, trigger.id) }}).
          Batterie : {{ bat }}%.
          {% if energy > 0 %}Energie ajoutee : {{ energy }} kWh.{% endif %}
    - service: script.tesla_refresh
  mode: single

#####################################################################
# 4b. CHARGE COMPLETE — LIMITE TESLA ATTEINTE
#####################################################################
# Quand la Tesla atteint sa limite de charge et s'arrete elle-meme
# (sensor.f_r_i_d_a_y_charge passe a 'complete'), l'auto 4 ne peut
# pas s'executer : ses triggers (vitesse/courant < 1 for 1 min)
# arrivent apres que Tessie a deja remonte switch = OFF, donc sa
# condition switch = on echoue et solar_charging reste bloque a ON.
# L'auto 7 (Resume) voit alors solar_charging=ON + switch=OFF +
# surplus > 4A et tente de relancer la charge en boucle.
#
# Cette auto comble ce cas :
#   - clear solar_charging (bloque auto 7)
#   - arrete le switch (idempotent si deja OFF)
#   - envoie la notification "charge terminee — limite atteinte"
#
# Condition solar_charging = on : evite le double-fire avec auto 4
# quand c'est HA qui a arrete la charge (auto 4 clear solar_charging
# avant que cette auto fasse la transition 'complete').
#####################################################################
- id: 'tesla_smart_charge_charge_complete'
  alias: Tesla Smart Charge - Charge complete (limite atteinte)

  trigger:
    - platform: state
      entity_id: sensor.f_r_i_d_a_y_charge
      to: 'complete'
      for:
        seconds: 30
  condition:
    - condition: state
      entity_id: input_boolean.tesla_smart_charge
      state: 'on'
    - condition: state
      entity_id: input_boolean.tesla_night_charge_pending
      state: 'off'
    - condition: state
      entity_id: input_boolean.tesla_solar_charging
      state: 'on'
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.f_r_i_d_a_y_recharge
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.tesla_solar_charging
    - delay:
        seconds: 3
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.awtrix_toggle_tesla
    - service: script.notify_fabien
      data:
        title: Tesla Smart Charge
        message: >-
          {% set bat = states('sensor.f_r_i_d_a_y_niveau_de_la_batterie') | int(0) %}
          {% set lim = states('number.f_r_i_d_a_y_limite_de_recharge') | int(0) %}
          {% set energy = states('sensor.f_r_i_d_a_y_energie_ajoutee_derniere_recharge') | float(0) | round(1) %}
          Charge terminee — limite {{ lim }}% atteinte. Batterie : {{ bat }}%.
          {% if energy > 0 %}Energie ajoutee : {{ energy }} kWh.{% endif %}
  mode: single

#####################################################################
# 5. SUIVI AMPERAGE (state-change avec garde de stabilite)
#####################################################################
# Ajuste l'amperage au surplus solaire.
# Toujours active — les conditions empechent toute action
# quand la charge est arretee ou le mode desactive.
#
# Trigger : sensor.tesla_optimized_amp stable depuis 15s
#   → reactivite face aux passages nuageux (fix 2026-07-25, voir marge
#     de securite ci-dessous). Anciennement 30s : trop lent face a un
#     nuage qui fait chuter le surplus en quelques secondes, causant un
#     tirage reseau le temps que la baisse d'amperage soit appliquee.
#
# Filtres qualite (pas de quota Tessie) :
#   - for: 15s sur le trigger
#   - Commande uniquement si |target - current| >= 1A
#
# Marge de securite -1A (fix 2026-07-25) : vise systematiquement
# surplus-1A plutot que le surplus exact. Absorbe les variations entre
# deux cycles de mesure sans tirer sur le reseau — au prix d'un leger
# sous-usage du surplus par ciel stable. Ne s'applique qu'au-dessus du
# plancher de 5A (le plancher lui-meme reste inchange, cf. auto 1/3).
#####################################################################
- id: 'tesla_smart_charge_update_amps'
  alias: Tesla Smart Charge - Suivi amperage

  trigger:
    - platform: state
      entity_id: sensor.tesla_optimized_amp
      for:
        seconds: 15
  condition:
    - condition: state
      entity_id: input_boolean.tesla_smart_charge
      state: 'on'
    - condition: state
      entity_id: input_boolean.tesla_night_charge_pending
      state: 'off'
    - condition: state
      entity_id: switch.f_r_i_d_a_y_recharge
      state: 'on'
    - condition: or
      conditions:
        - condition: state
          entity_id: device_tracker.f_r_i_d_a_y_emplacement
          state: home
        - condition: state
          entity_id: device_tracker.tesla_y
          state: home
    - condition: template
      value_template: >-
        {% set target = states('sensor.tesla_optimized_amp') | int(0) - 1 %}
        {% set current = states('number.f_r_i_d_a_y_courant_de_recharge') | int(0) %}
        {{ (target - current) | abs >= 1 }}
  action:
    - service: number.set_value
      target:
        entity_id: number.f_r_i_d_a_y_courant_de_recharge
      data:
        value: >-
          {% set opt = states('sensor.tesla_optimized_amp') | int(0) - 1 %}
          {% set max_amps = [states('input_number.tesla_max_amps') | int(28), state_attr('number.f_r_i_d_a_y_courant_de_recharge', 'max') | int(28)] | min %}
          {{ [5, [opt, max_amps] | min] | max }}
  mode: single

#####################################################################
# 6. PAUSE SOLAIRE
#####################################################################
# Surplus < 5A pendant 3 min : pause temporaire de la charge.
# Le suivi amperage (5) ne fait rien car switch = off.
# Le resume (7) relancera quand le surplus revient.
#####################################################################
- id: 'tesla_smart_charge_pause'
  alias: Tesla Smart Charge - Pause solaire

  trigger:
    # Cas normal : surplus tombe sous 5A apres avoir charge (transition)
    - platform: numeric_state
      entity_id: sensor.tesla_optimized_amp
      below: 5
      for:
        minutes: 3
    # Cas demarrage sans soleil : la charge vient de s'activer mais
    # tesla_optimized_amp etait deja a 0 → pas de transition detectable.
    # On attend 3 min apres le switch ON et on verifie le surplus.
    - platform: state
      entity_id: switch.f_r_i_d_a_y_recharge
      to: 'on'
      for:
        minutes: 3
  condition:
    - condition: state
      entity_id: input_boolean.tesla_smart_charge
      state: 'on'
    - condition: state
      entity_id: input_boolean.tesla_night_charge_pending
      state: 'off'
    - condition: state
      entity_id: switch.f_r_i_d_a_y_recharge
      state: 'on'
    - condition: or
      conditions:
        - condition: state
          entity_id: device_tracker.f_r_i_d_a_y_emplacement
          state: home
        - condition: state
          entity_id: device_tracker.tesla_y
          state: home
    - condition: numeric_state
      entity_id: sensor.tesla_optimized_amp
      below: 5
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.f_r_i_d_a_y_recharge
    - service: script.notify_fabien
      data:
        title: Tesla Smart Charge
        message: >-
          {% set bat = states('sensor.f_r_i_d_a_y_niveau_de_la_batterie') | int(0) %}
          {% set opt = states('sensor.tesla_optimized_amp') | int(0) %}
          {% set solaire = states('sensor.solar_total') | int(0) %}
          Charge mise en pause — surplus insuffisant ({{ opt }}A, seuil 5A).
          Production solaire : {{ solaire }}W. Batterie : {{ bat }}%.
  mode: single

#####################################################################
# 7. RESUME SOLAIRE
#####################################################################
# Surplus >= 5A pendant 3 min : reprend la charge.
# Re-applique aussi charge_limit = tesla_soc_solaire_max : defense
# contre une derive cote Tesla pendant la pause (modif via app, commande
# Tessie perdue avec voiture endormie, etc.). Sans ce filet, la
# voiture peut s'arreter prematurement a une vieille limite (ex 63%).
#
# Condition input_boolean.tesla_solar_charging :
#   Remplace le check device_tracker (insuffisant si la voiture dort).
#   Si la session est active, la voiture est forcement home+branchee.
#   Reset automatique par auto 9 (cable) ou auto 2 (desactivation).
#
# Action : reveille la voiture avant d'envoyer les commandes (fix
#   bug 2026-05-17 : commandes perdues quand la voiture s'endort
#   pendant une pause solaire de >10 min).
#
# Trigger periodique (filet, bug 2026-07-09) : le trigger numeric_state
# ne se declenche que sur un FRONT montant du capteur. Si optimized_amp
# est deja > 4A en continu quand la charge s'arrete (ex : fin de charge
# HC de midi avec du solaire dispo depuis un moment), aucun nouveau
# franchissement n'a lieu et la charge solaire reste bloquee a l'arret
# indefiniment. Le trigger toutes les 5 min reevalue l'etat courant
# independamment de tout franchissement, sur le meme modele que
# TeslaNightCharge.yaml auto 3b (resume apres protection reseau).
#####################################################################
- id: 'tesla_smart_charge_resume'
  alias: Tesla Smart Charge - Resume solaire

  trigger:
    - platform: numeric_state
      entity_id: sensor.tesla_optimized_amp
      above: 4
      for:
        minutes: 3
      id: seuil
    - platform: time_pattern
      minutes: '/5'
      id: periodique
  condition:
    - condition: state
      entity_id: input_boolean.tesla_smart_charge
      state: 'on'
    - condition: state
      entity_id: input_boolean.tesla_night_charge_pending
      state: 'off'
    # Session solaire explicitement active (set par Demarrage/Activation,
    # reset par Desactivation/Arret/cable debranche/nuit).
    # Remplace le check device_tracker : si la session est active,
    # la voiture est forcement a la maison et branchee.
    - condition: state
      entity_id: input_boolean.tesla_solar_charging
      state: 'on'
    - condition: state
      entity_id: switch.f_r_i_d_a_y_recharge
      state: 'off'
    # Filet periodique : re-verifie le seuil (le trigger time_pattern
    # n'a lui-meme aucune notion de valeur de capteur, contrairement
    # au trigger numeric_state qui garantit deja > 4A pour l'autre voie).
    - condition: numeric_state
      entity_id: sensor.tesla_optimized_amp
      above: 4
    # Filet de securite : n'essaie pas de relancer si la batterie
    # a deja atteint la limite (auto 4b est le fix primaire, mais
    # solar_charging peut rester ON si auto 4b rate aussi — ex :
    # transition 'complete' manquee car voiture deja endormie).
    - condition: template
      value_template: >-
        {{ states('sensor.f_r_i_d_a_y_niveau_de_la_batterie') | int
           < (states('number.f_r_i_d_a_y_limite_de_recharge') | int - 1) }}
  action:
    # Reveille la voiture si elle dort (evite la perte de commandes
    # quand la voiture s'endort pendant une longue pause solaire).
    - service: script.tesla_refresh
    - delay:
        seconds: 5
    # Re-applique la limite SoC max solaire avant turn_on (defense
    # contre une derive cote Tesla pendant la pause).
    - service: number.set_value
      target:
        entity_id: number.f_r_i_d_a_y_limite_de_recharge
      data:
        value: "{{ states('input_number.tesla_soc_solaire_max') | int(80) }}"
    - service: switch.turn_on
      target:
        entity_id: switch.f_r_i_d_a_y_recharge
    - delay:
        seconds: 5
    # Marge de securite -1A : cf. auto 5 (Suivi amperage)
    - service: number.set_value
      target:
        entity_id: number.f_r_i_d_a_y_courant_de_recharge
      data:
        value: >-
          {% set opt = states('sensor.tesla_optimized_amp') | int(0) - 1 %}
          {% set max_amps = [states('input_number.tesla_max_amps') | int(28), state_attr('number.f_r_i_d_a_y_courant_de_recharge', 'max') | int(28)] | min %}
          {{ [5, [opt, max_amps] | min] | max }}
    - service: script.notify_fabien
      data:
        title: Tesla Smart Charge
        message: >-
          {% set bat = states('sensor.f_r_i_d_a_y_niveau_de_la_batterie') | int(0) %}
          {% set solaire = states('sensor.tesla_optimized_amp') | int(0) %}
          Charge reprise — surplus solaire suffisant ({{ solaire }}A).
          Batterie : {{ bat }}%.
  mode: single

#####################################################################
# 8. PROTECTION RESEAU (reaction rapide)
#####################################################################
# Le suivi amperage (5) reagit en ~30-90s aux variations stables —
# trop lent si un gros consommateur s'allume brutalement (four,
# seche-linge, etc.).
#
# Cette automation reagit en < 20s quand le soutirage reseau depasse
# (tesla_grid_limit - 500W de marge) et reduit immediatement
# l'amperage Tesla au maximum admissible (sensor.tesla_max_amp_grid).
# Avec defaut 15 500W : declenchement a 15 000W.
#
# Si le max admissible tombe sous 5A, la charge est mise en pause.
# Ne s'active PAS en charge nocturne (tesla_night_charge_pending=on)
# car celle-ci a sa propre gestion reseau (automations 3 et 3b).
#####################################################################
- id: 'tesla_smart_charge_grid_protect'
  alias: Tesla Smart Charge - Protection reseau

  trigger:
    # Trigger derive de tesla_grid_limit pour rester aligne si l'user
    # ajuste la limite via l'UI (template re-evalue a chaque change
    # du sensor P1 et de l'input_number).
    - platform: template
      value_template: >-
        {{ states('sensor.p1_meter_3c39e7284d28_active_power') | float(0)
           > (states('input_number.tesla_grid_limit') | float(15500) - 500) }}
      for:
        seconds: 10
  condition:
    - condition: state
      entity_id: input_boolean.tesla_night_charge_pending
      state: 'off'
    - condition: state
      entity_id: switch.f_r_i_d_a_y_recharge
      state: 'on'
    - condition: or
      conditions:
        - condition: state
          entity_id: device_tracker.f_r_i_d_a_y_emplacement
          state: home
        - condition: state
          entity_id: device_tracker.tesla_y
          state: home
  action:
    - choose:
        # Si le max admissible est trop bas, pause la charge
        - conditions:
            - condition: numeric_state
              entity_id: sensor.tesla_max_amp_grid
              below: 5
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.f_r_i_d_a_y_recharge
            - service: script.notify_fabien
              data:
                title: Tesla Protection Reseau
                message: >-
                  {% set p1 = states('sensor.p1_meter_3c39e7284d28_active_power') | int(0) %}
                  {% set limite = states('input_number.tesla_grid_limit') | int(15500) %}
                  Charge Tesla mise en pause — soutirage reseau {{ p1 }}W
                  (limite {{ limite }}W). Reprise auto quand le surplus revient.
      # Sinon, reduit au max admissible
      default:
        - service: number.set_value
          target:
            entity_id: number.f_r_i_d_a_y_courant_de_recharge
          data:
            value: >-
              {% set max_grid = states('sensor.tesla_max_amp_grid') | int(5) %}
              {{ [5, max_grid] | max }}
  mode: single

#####################################################################
# 9. RESET LIMITE ET SESSION EN FIN DE CHARGE SOLAIRE
#####################################################################
# Remet solar_charging a OFF et (si necessaire) restaure charge_limit
# a tesla_soc_solaire_max quand :
#   - le cable est debranche pendant 30s (la voiture part)
#   - le soleil se couche (sun.sun -> below_horizon)
#   - la voiture quitte la maison (GPS Tessie -> not_home, delai 60s)
#
# Le trigger "depart" est un filet de securite : si Tessie tarde a
# remonter cable=OFF (voiture partie mais sensor encore stale), les
# triggers cable et nuit ne peuvent pas fire. Des que le GPS detecte
# le depart, solar_charging est immediatement reset pour empecher
# l'auto 7 (Resume) d'envoyer des commandes a la voiture absente.
# Pour ce trigger, on ne touche pas a charge_limit via Tessie : la
# voiture est en mouvement ou inaccessible.
#
# Condition : pending=off ET (limite differente OU solar_charging=on).
# Le OR sur solar_charging est indispensable : en charge solaire normale
# la limite est deja a soc_solaire_max des le demarrage (autos 1/3),
# donc la condition "limite differente" serait toujours fausse et
# solar_charging resterait bloque a ON apres debranchement. L'auto 7
# (Resume) s'appuie sur solar_charging=on comme garde "voiture home+
# branchee" — si elle est ON alors que la voiture est partie, Resume
# enverrait des commandes a la voiture absente.
#
# Le set_value charge_limit est conditionnel (if-then) : evite un appel
# Tessie inutile quand la limite est deja correcte, et est skip pour
# le trigger "depart" (voiture inaccessible).
#
# Filet de securite : si une charge HC a modifie la limite et que les
# autos NightCharge 2/4/5 n'ont pas reset, cette auto restaure la valeur.
#
# Note sur le choix sun.sun plutot que tarif T2 :
# Le tarif HC inclut aussi la plage midi 11h-17h en Wallonie 2026.
# Utiliser le tarif resetterait la limite a 11h alors que le surplus
# solaire est encore exploitable l'apres-midi.
#####################################################################
- id: 'tesla_smart_charge_reset_limit'
  alias: Tesla Smart Charge - Reset limite SoC max solaire

  trigger:
    - platform: state
      entity_id: binary_sensor.f_r_i_d_a_y_cable_de_charge
      to: 'off'
      for:
        seconds: 30
      id: cable
    - platform: state
      entity_id: sun.sun
      to: 'below_horizon'
      id: nuit
    # Filet de securite : reset solar_charging des que le GPS detecte le
    # depart, sans attendre que Tessie mette a jour le sensor cable.
    # Delai 60s : evite les faux positifs sur une sortie de zone GPS breve.
    - platform: state
      entity_id: device_tracker.f_r_i_d_a_y_emplacement
      to: 'not_home'
      for:
        seconds: 60
      id: depart
  condition:
    # Pas pendant une charge HC active (l'auto 1 NightCharge a fixe
    # la limite a la cible HC volontairement).
    - condition: state
      entity_id: input_boolean.tesla_night_charge_pending
      state: 'off'
    # Agit si la limite differe du helper OU si une session solaire est
    # encore marquee comme active. En charge solaire normale, la limite
    # est deja a soc_solaire_max des le demarrage (autos 1/3) : sans le
    # OR, solar_charging resterait bloque a ON apres debranchement,
    # permettant a l'auto 7 (Resume) d'envoyer des commandes a la
    # voiture absente.
    - condition: template
      value_template: >-
        {{ (states('number.f_r_i_d_a_y_limite_de_recharge') | int(0)
            != states('input_number.tesla_soc_solaire_max') | int(80))
           or is_state('input_boolean.tesla_solar_charging', 'on') }}
  action:
    # Reset la limite seulement si elle differe ET si la voiture est
    # accessible (cable ou nuit). Pour le trigger "depart" (voiture en
    # mouvement / inaccessible), on skip l'appel Tessie.
    - if:
        - condition: template
          value_template: >-
            {{ trigger.id != 'depart'
               and states('number.f_r_i_d_a_y_limite_de_recharge') | int(0)
                   != states('input_number.tesla_soc_solaire_max') | int(80) }}
      then:
        - service: number.set_value
          target:
            entity_id: number.f_r_i_d_a_y_limite_de_recharge
          data:
            value: "{{ states('input_number.tesla_soc_solaire_max') | int(80) }}"
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.tesla_solar_charging
    - service: script.notify_fabien
      data:
        title: Tesla Smart Charge
        message: >-
          {% set reasons = {
            'cable': 'cable debranche',
            'nuit': 'coucher du soleil',
            'depart': 'voiture quittee la maison'
          } %}
          {% set bat = states('sensor.f_r_i_d_a_y_niveau_de_la_batterie') | int(0) %}
          {% set lim = states('input_number.tesla_soc_solaire_max') | int(80) %}
          Charge solaire terminee ({{ reasons.get(trigger.id, trigger.id) }}).
          Batterie : {{ bat }}%. Limite de charge : {{ lim }}%.
  mode: single

#####################################################################
# 10. SYNC HELPER tesla_soc_solaire_max
#####################################################################
# Quand l'utilisateur modifie le helper depuis le dashboard, propage
# immediatement la valeur a number.f_r_i_d_a_y_limite_de_recharge (Tesla).
#
# Si la voiture est branchee + maitre on + pending off + home, et
# que la batterie est < nouvelle limite avec un surplus suffisant,
# relance immediatement la charge (sinon il faudrait attendre l'auto 7
# Resume solaire et son hysteresis 3 min).
#
# Bloquee pendant une charge HC (pending=on) : la HC utilise tesla_soc_cible,
# le helper sera applique automatiquement a la fin HC par les auto 2/4/5.
#####################################################################
- id: 'tesla_smart_charge_sync_soc_max'
  alias: Tesla Smart Charge - Sync helper SoC max solaire

  trigger:
    - platform: state
      entity_id: input_number.tesla_soc_solaire_max
  condition:
    - condition: state
      entity_id: input_boolean.tesla_night_charge_pending
      state: 'off'
  action:
    - service: number.set_value
      target:
        entity_id: number.f_r_i_d_a_y_limite_de_recharge
      data:
        value: "{{ states('input_number.tesla_soc_solaire_max') | int(80) }}"
    # Si conditions de charge solaire reunies et batterie < nouvelle limite,
    # relance immediatement (sinon Tesla redemarrera elle-meme a la cible).
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.tesla_smart_charge
              state: 'on'
            - condition: or
              conditions:
                - condition: state
                  entity_id: device_tracker.f_r_i_d_a_y_emplacement
                  state: home
                - condition: state
                  entity_id: device_tracker.tesla_y
                  state: home
            - condition: state
              entity_id: binary_sensor.f_r_i_d_a_y_cable_de_charge
              state: 'on'
            - condition: state
              entity_id: switch.f_r_i_d_a_y_recharge
              state: 'off'
            - condition: template
              value_template: >-
                {{ states('sensor.f_r_i_d_a_y_niveau_de_la_batterie') | int(0)
                   < states('input_number.tesla_soc_solaire_max') | int(80) - 1 }}
            - condition: numeric_state
              entity_id: sensor.tesla_optimized_amp
              above: 4
          sequence:
            - service: switch.turn_on
              target:
                entity_id: switch.f_r_i_d_a_y_recharge
            - delay:
                seconds: 5
            # Marge de securite -1A : cf. auto 5 (Suivi amperage)
            - service: number.set_value
              target:
                entity_id: number.f_r_i_d_a_y_courant_de_recharge
              data:
                value: >-
                  {% set opt = states('sensor.tesla_optimized_amp') | int(0) - 1 %}
                  {% set max_amps = [states('input_number.tesla_max_amps') | int(28), state_attr('number.f_r_i_d_a_y_courant_de_recharge', 'max') | int(28)] | min %}
                  {{ [5, [opt, max_amps] | min] | max }}
            - service: script.notify_fabien
              data:
                title: Tesla Smart Charge
                message: >-
                  {% set lim = states('input_number.tesla_soc_solaire_max') | int(80) %}
                  {% set bat = states('sensor.f_r_i_d_a_y_niveau_de_la_batterie') | int(0) %}
                  {% set surplus = states('sensor.tesla_optimized_amp') | int(0) %}
                  Limite solaire mise a {{ lim }}%, charge relancee a {{ surplus }}A.
                  Batterie : {{ bat }}%.
      default:
        - service: script.notify_fabien
          data:
            title: Tesla Smart Charge
            message: >-
              {% set lim = states('input_number.tesla_soc_solaire_max') | int(80) %}
              Limite solaire mise a jour : {{ lim }}%.
  mode: single

# Auto 11 supprimee : elle generait 5 appels Tessie apres chaque
# set_value amperage, soit 150-200 requetes/h par ciel variable.
# L'integration Fleet poll automatiquement toutes les 30-60s.
